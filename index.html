    <!-- Apply saved theme + language before first paint (no flash). Keys match src/lib/storage.js -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem("hk.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          d.dataset.theme = t;
          var l = localStorage.getItem("hk.lang");
          if (l === "fr" || l === "ar" || l === "en") {
            d.lang = l;
            d.dir = l === "ar" ? "rtl" : "ltr";
          }
        } catch (e) {
          d.dataset.theme = "light";
        }
      })();
    </script>
